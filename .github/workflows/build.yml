name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap copy ios
          cd ios/App && pod install

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build unsigned app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -80

      - name: Package IPA
        run: |
          APP=$(find ios/App/build/Build/Products -name "App.app" | head -1)
          if [ -z "$APP" ]; then echo "App.app not found"; find ios/App/build -type d | head -50; exit 1; fi
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -r ../OpenVK-vkui-unsigned.ipa Payload
          cd ..
          ls -la OpenVK-vkui-unsigned.ipa
          shasum -a 256 OpenVK-vkui-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenVK-vkui-unsigned-ipa
          path: OpenVK-vkui-unsigned.ipa
          retention-days: 30
